name: Build Dev Environment

on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Mon 03:00 UTC) to pick up upstream security updates.
    - cron: '0 3 * * 1'
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-deps.yml'
      - '.github/actions/prepare-dev/**'

concurrency:
  group: build-deps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare or refresh shared dev environment
        uses: ./.github/actions/prepare-dev
        with:
          publish: true
          refresh: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
