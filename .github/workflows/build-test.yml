name: Build And Test

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      reuse_tested:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
    outputs:
      image:
        description: Published, tested runtime digest
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      COMPOSE_FILE: .devcontainer/docker-compose.yml
      COMPOSE_PROJECT_NAME: dasi-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate source version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(grep -oP 'project\(\s*dasi\s+VERSION\s+\K[0-9]+(\.[0-9]+)*' CMakeLists.txt)
          if [[ -n "$RELEASE_TAG" && "${RELEASE_TAG#v}" != "$version" ]]; then
            echo "Release tag does not match the checked-out DASI version." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare shared dev environment
        id: dev
        uses: ./.github/actions/prepare-dev
        with:
          publish: ${{ inputs.publish }}

      - name: Resolve runtime cache reference
        id: vars
        env:
          DEV_IDENTITY: ${{ steps.dev.outputs.identity }}
          DEV_IMAGE: ${{ steps.dev.outputs.image }}
        run: |
          set -euo pipefail
          repository=$(printf '%s\n' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repository}:sha-${GITHUB_SHA}-${DEV_IDENTITY}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "RUNTIME_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "DEV_IMAGE=${DEV_IMAGE}" >> "$GITHUB_ENV"

      - name: Check for previously tested runtime
        id: cached
        run: |
          set -euo pipefail
          if docker pull "$RUNTIME_IMAGE"; then
            revision=$(docker image inspect "$RUNTIME_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            tested=$(docker image inspect "$RUNTIME_IMAGE" --format '{{index .Config.Labels "io.dasi.tests.passed"}}')
            if [[ "$revision" == "$GITHUB_SHA" && "$tested" == "true" ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        if: steps.cached.outputs.exists != 'true' || !inputs.reuse_tested
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.dev.outputs.identity }}-${{ hashFiles('bundle/Dependencies.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.dev.outputs.identity }}-${{ hashFiles('bundle/Dependencies.cmake') }}-

      - name: Build once and run all tests
        if: steps.cached.outputs.exists != 'true' || !inputs.reuse_tested
        run: |
          set -euo pipefail
          if [[ "$DEV_IMAGE" == *@* ]]; then
            docker pull "$DEV_IMAGE"
          fi
          mkdir -p .ccache
          docker image inspect "$DEV_IMAGE" > /dev/null
          docker compose --profile integration --profile ci run --rm --user root test

      - name: Build runtime from tested installation
        if: steps.cached.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: dasi-runtime
          load: true
          provenance: false
          tags: ${{ steps.vars.outputs.image }}
          build-args: DASI_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.dasi.tests.passed=true
          cache-from: type=gha,scope=dasi-runtime
          cache-to: type=gha,mode=max,scope=dasi-runtime

      - name: Smoke-test installed runtime
        env:
          DASI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            --env "DASI_EXPECTED_VERSION=$DASI_VERSION" \
            --volume "$PWD/scripts/smoke-test.sh:/smoke.sh:ro" \
            "$RUNTIME_IMAGE" bash /smoke.sh

      - name: Publish tested runtime
        id: publish
        if: inputs.publish
        env:
          CACHED: ${{ steps.cached.outputs.exists }}
        run: |
          set -euo pipefail
          if [[ "$CACHED" != "true" ]]; then
            docker push "$RUNTIME_IMAGE"
          fi
          image=$(docker image inspect "$RUNTIME_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/*.xml
          if-no-files-found: ignore

      - name: Dump integration logs on failure
        if: failure()
        run: docker compose --profile integration --profile ci logs --no-color --timestamps

      - name: Clean up integration services
        if: always()
        run: docker compose --profile integration --profile ci down --volumes --remove-orphans
