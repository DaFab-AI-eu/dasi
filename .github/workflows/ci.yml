name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml
    with:
      publish: ${{ github.event_name == 'push' }}

  ci:
    name: ci
    if: always()
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          if [[ "${{ needs.build-test.result }}" != "success" ]]; then
            echo "Build, tests, or runtime validation failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
