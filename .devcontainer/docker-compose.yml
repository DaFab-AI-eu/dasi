name: dasi

x-dev-image: &dev-image
  image: ${DEV_IMAGE:-dasi-dev:local}
  build:
    context: ..
    dockerfile: Dockerfile
    target: dev-env

x-client-environment: &client-environment
  # Without this the rucio CLI imports server-only modules (rucio.core).
  RUCIO_CLIENT_MODE: 'True'
  RUCIO_ACCOUNT: ${RUCIO_ACCOUNT:-root}
  RUCIO_AUTH_TYPE: ${RUCIO_AUTH_TYPE:-userpass}
  RUCIO_HOST: ${RUCIO_HOST:-http://rucio-server}
  RUCIO_CFG_CLIENT_USERNAME: ${RUCIO_USERNAME:-root}
  RUCIO_CFG_CLIENT_PASSWORD: ${RUCIO_PASSWORD:-secret}
  RUCIO_CFG_CLIENT_ACCOUNT: ${RUCIO_ACCOUNT:-root}
  RUCIO_CFG_CLIENT_AUTH_TYPE: ${RUCIO_AUTH_TYPE:-userpass}
  RUCIO_CFG_CLIENT_RUCIO_HOST: ${RUCIO_HOST:-http://rucio-server}
  RUCIO_CFG_CLIENT_AUTH_HOST: ${RUCIO_HOST:-http://rucio-server}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio1234}
  AWS_DEFAULT_REGION: ${MINIO_REGION:-eu-central-1}
  MINIO_HOST: https://minio:9000
  MINIO_BUCKET: ${MINIO_BUCKET:-dasi}
  MINIO_REGION: ${MINIO_REGION:-eu-central-1}

services:
  rucio-db:
    profiles: [integration]
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dasi}
      POSTGRES_USER: ${POSTGRES_USER:-dasi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dasi}
    volumes:
      - ruciodb:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

  rucio-init:
    profiles: [integration]
    image: rucio/rucio-init:release-40.2.0
    entrypoint: ['/bin/bash']
    restart: 'no'
    depends_on:
      rucio-db:
        condition: service_healthy
    command: ['/usr/local/bin/rucio-init-wrapper.sh']
    environment:
      # Rucio 40 images ship psycopg v3 only; a bare postgresql:// URL selects psycopg2.
      - RUCIO_CFG_DATABASE_DEFAULT=postgresql+psycopg://${POSTGRES_USER:-dasi}:${POSTGRES_PASSWORD:-dasi}@rucio-db/${POSTGRES_DB:-dasi}
      - RUCIO_BOOTSTRAP=True
      - RUCIO_ACCOUNT=${RUCIO_ACCOUNT:-root}
      - RUCIO_AUTH_TYPE=${RUCIO_AUTH_TYPE:-userpass}
      - RUCIO_USERNAME=${RUCIO_USERNAME:-root}
      - RUCIO_PASSWORD=${RUCIO_PASSWORD:-secret}
      - RUCIO_HOST=${RUCIO_HOST:-http://rucio-server}
    volumes:
      - ./rucio-init-wrapper.sh:/usr/local/bin/rucio-init-wrapper.sh:ro
      - rucioinitstate:/var/lib/rucio-init

  rucio-server:
    profiles: [integration]
    image: rucio/rucio-server:release-40.2.0
    depends_on:
      rucio-db:
        condition: service_healthy
      rucio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:80/ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      # No rucio.cfg is mounted, so the entrypoint generates it from RUCIO_CFG_* variables.
      - RUCIO_CFG_DATABASE_DEFAULT=postgresql+psycopg://${POSTGRES_USER:-dasi}:${POSTGRES_PASSWORD:-dasi}@rucio-db/${POSTGRES_DB:-dasi}
      # Basic configuration variables
      - RUCIO_ENABLE_SSL=${RUCIO_ENABLE_SSL:-False}
      - RUCIO_SERVER_TYPE=${RUCIO_SERVER_TYPE:-rest}
      - RUCIO_LOG_LEVEL=${RUCIO_LOG_LEVEL:-INFO}
      # Allow the server to know its external address if needed
      - RUCIO_HOSTNAME=${RUCIO_HOSTNAME:-localhost}
      # Auth configuration for admin operations
      - RUCIO_ACCOUNT=${RUCIO_ACCOUNT:-root}
      - RUCIO_AUTH_TYPE=${RUCIO_AUTH_TYPE:-userpass}
      - RUCIO_USERNAME=${RUCIO_USERNAME:-root}
      - RUCIO_PASSWORD=${RUCIO_PASSWORD:-secret}
      # MinIO S3 credentials for server-side PFN construction
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minio1234}
      - AWS_DEFAULT_REGION=${MINIO_REGION:-eu-central-1}
      - MINIO_HOST=https://minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET:-dasi}
      - MINIO_REGION=${MINIO_REGION:-eu-central-1}
      - PYTHONPATH=/workspace/dasi/pydasi/src
    volumes:
      - ../pydasi/src:/workspace/dasi/pydasi/src:ro
      - ./rucio/httpd-servername.conf:/etc/httpd/conf.d/00-servername.conf:ro
      - ./rucio/rucio.conf.j2:/tmp/rucio.conf.j2:ro

  # eckit's S3 client forces HTTPS, so MinIO must serve TLS.
  minio:
    profiles: [integration]
    image: ${MINIO_IMAGE:-pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46}
    command: ['--certs-dir', '/certs', 'server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio1234}
      MINIO_REGION: ${MINIO_REGION:-eu-central-1}
      MC_HOST_local: https://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD:-minio1234}@localhost:9000
    volumes:
      - minio-data:/data
      - ./minio/certs:/certs:ro
    healthcheck:
      test: ['CMD', 'mc', '--insecure', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    profiles: [integration]
    image: ${MINIO_IMAGE:-pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46}
    entrypoint: /bin/sh
    command: ['-ec', 'mc --insecure mb --ignore-existing "local/$$MINIO_BUCKET"']
    environment:
      MC_HOST_local: https://${MINIO_ROOT_USER:-minio}:${MINIO_ROOT_PASSWORD:-minio1234}@minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-dasi}
    depends_on:
      minio:
        condition: service_healthy

  rucio-setup:
    <<: *dev-image
    profiles: [integration]
    command: ['bash', '/usr/local/bin/rucio-setup.sh']
    environment: *client-environment
    depends_on:
      rucio-server:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./rucio/rucio.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ./rucio-setup.sh:/usr/local/bin/rucio-setup.sh:ro

  dasi-dev:
    <<: *dev-image
    environment: *client-environment
    volumes:
      - ..:/workspace/dasi:cached
      - ./rucio/rucio.cfg:/opt/rucio/etc/rucio.cfg:ro
      # Optional host grid certificates for x509 Rucio authentication.
      - ${GLOBUS_DIR:-./rucio/.globus}:/etc/grid-security:ro
      - bundle-sources:/workspace/bundle
      - build-cache:/tmp/build
      - compiler-cache:/workspace/.ccache
      - install-cache:/workspace/install
    cap_add:
      - SYS_PTRACE
    ulimits:
      core: -1
    stdin_open: true
    tty: true

  test:
    <<: *dev-image
    profiles: [ci]
    environment: *client-environment
    volumes:
      - ..:/workspace/dasi
      - ./rucio/rucio.cfg:/opt/rucio/etc/rucio.cfg:ro
      - ../.ccache:/workspace/.ccache
    depends_on:
      rucio-setup:
        condition: service_completed_successfully
    command: ['bash', '/workspace/dasi/scripts/build-and-test.sh']

volumes:
  ruciodb:
  rucioinitstate:
  minio-data:
  bundle-sources:
  build-cache:
  compiler-cache:
  install-cache:
